[project]
name = "evaluacion-agente-des"
version = "1.0.0"
description = "Agente LangChain que usa un servidor MCP con una DES estocástica para recomendar puestos de atención"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Versiones fijadas en uv.lock: LangChain/LangGraph para el agente, SimPy para la DES, MCP como extra y pytest.
dependencies = [
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
    "langgraph==1.2.10",
    "python-dotenv==1.2.2",
    "simpy==4.1.1",
    "jupyterlab==4.6.2",
    "ipykernel==7.3.0",
    "pydantic==2.13.4",
    "pytest==9.1.1",
]

[project.optional-dependencies]
mcp = [
    "mcp==1.29.0",
    "langchain-mcp-adapters==0.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
